name: App

on:
  workflow_run:
    workflows:
      - Infra
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      PUBLISH_DIR: ${{ github.workspace }}/artifacts/publish
      ZIP_PATH: ${{ github.workspace }}/artifacts/app.zip
      TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME }}
      TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Download Deployment Outputs Artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          name: deployment-outputs
          path: deployment-outputs
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ env.GITHUB_TOKEN }}

      - name: Load Deployment Settings
        run: |
          OUTPUT_FILE="deployment-outputs/deployment-outputs.env"

          if [ -f "$OUTPUT_FILE" ]; then
            set -a
            . "$OUTPUT_FILE"
            set +a
          else
            terraform -chdir=infra init \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$TFSTATE_CONTAINER_NAME" \
              -backend-config="key=$TFSTATE_KEY" \
              -backend-config="use_oidc=true" \
              -backend-config="client_id=$ARM_CLIENT_ID" \
              -backend-config="tenant_id=$ARM_TENANT_ID" \
              -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

            RESOURCE_GROUP_NAME="$(terraform -chdir=infra output -raw resource_group_name)"
            WEB_APP_NAME="$(terraform -chdir=infra output -raw web_app_name)"
          fi

          echo "RESOURCE_GROUP_NAME=$RESOURCE_GROUP_NAME" >> "$GITHUB_ENV"
          echo "WEB_APP_NAME=$WEB_APP_NAME" >> "$GITHUB_ENV"

      - name: Validate Deployment Settings
        run: |
          if [ -z "$RESOURCE_GROUP_NAME" ] || [ -z "$WEB_APP_NAME" ]; then
            echo "Missing RESOURCE_GROUP_NAME or WEB_APP_NAME"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LoL_Demo.sln

      - name: Build
        run: dotnet build LoL_Demo.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LandOLakesDairyDemo.Tests.csproj --configuration Release 

      - name: Publish
        run: dotnet publish LandOLakesDairyDemo.csproj --configuration Release --no-build --output "$PUBLISH_DIR"

      - name: Zip Publish Output
        run: |
          mkdir -p "$(dirname "$ZIP_PATH")"
          cd "$PUBLISH_DIR"
          zip -r "$ZIP_PATH" .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ZIP Package
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --name "$WEB_APP_NAME" \
            --src-path "$ZIP_PATH" \
            --type zip
