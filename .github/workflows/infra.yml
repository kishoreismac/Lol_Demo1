name: Infra

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  TF_IN_AUTOMATION: true
  TFSTATE_CONTAINER_NAME: ${{ vars.TFSTATE_CONTAINER_NAME }}
  TFSTATE_KEY: ${{ vars.TFSTATE_KEY }}
  TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
  TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_STORAGE_LOCATION: ${{ vars.TFSTATE_STORAGE_LOCATION }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Remote State Backend
        run: |
          az group create \
            --name "$TFSTATE_RESOURCE_GROUP" \
            --location "$TFSTATE_STORAGE_LOCATION"

          az storage account create \
            --name "$TFSTATE_STORAGE_ACCOUNT" \
            --resource-group "$TFSTATE_RESOURCE_GROUP" \
            --location "$TFSTATE_STORAGE_LOCATION" \
            --sku Standard_LRS \
            --kind StorageV2 \
            --allow-blob-public-access false

          az storage container create \
            --name "$TFSTATE_CONTAINER_NAME" \
            --account-name "$TFSTATE_STORAGE_ACCOUNT" \
            --auth-mode login

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER_NAME" \
            -backend-config="key=$TFSTATE_KEY" \
            -backend-config="use_oidc=true" \
            -backend-config="client_id=$ARM_CLIENT_ID" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="subscription_id=$ARM_SUBSCRIPTION_ID"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Capture Outputs
        run: |
          printf 'RESOURCE_GROUP_NAME=%s\n' "$(terraform output -raw resource_group_name)" > deployment-outputs.env
          printf 'WEB_APP_NAME=%s\n' "$(terraform output -raw web_app_name)" >> deployment-outputs.env

      - name: Upload Deployment Outputs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: infra/deployment-outputs.env
          if-no-files-found: error
